name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master", "main.yml" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # เพิ่ม working-directory หากโปรเจกต์อยู่ในโฟลเดอร์ย่อย police-utility-mod
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./police-utility-mod

      - name: Build with Gradle
        run: ./gradlew build
        working-directory: ./police-utility-mod

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: police-utility-mod-jar
          path: police-utility-mod/build/libs/*.jar
