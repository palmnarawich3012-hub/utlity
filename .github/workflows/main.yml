name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write           # ใช้ตอนสร้าง Release จาก tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: police-utility-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

      - name: Upload build report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build/reports/

      - name: Create GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
          generate_release_notes: true
